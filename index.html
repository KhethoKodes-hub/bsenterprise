<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading | BS Enterprise</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #faf6f0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Roboto', sans-serif;
            overflow: hidden;
        }

        /* fullscreen video background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* dark overlay so text stays readable */
        .video-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.55);
            z-index: 1;
        }

        /* simple loader container */
        .loader-wrapper {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 2;
        }

        /* your requested loader - yellow and white version */
        .loader {
            height: 80px;
            aspect-ratio: 1;
            padding: 10px;
            border-radius: 50%;
            box-sizing: border-box;
            position: relative;
            margin: 0 auto 30px auto;
            mask: conic-gradient(#000 0 0) content-box exclude, conic-gradient(#000 0 0);
            filter: blur(12px);
        }

        .loader:before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-conic-gradient(#0000 0 5%, #f5b81b, #0000 20% 50%);
            animation: l2 1.5s linear infinite;
            border-radius: 50%;
        }

        @keyframes l2 {
            to { rotate: 1turn }
        }

        /* brand name - yellow */
        .brand {
            font-size: 1.8rem;
            font-weight: 600;
            letter-spacing: 1px;
            color: #f5b81b;
            margin-bottom: 0.5rem;
        }

        .sub {
            color: #e8c96a;
            font-size: 0.85rem;
            font-weight: 400;
            margin-bottom: 2rem;
        }

        /* simple progress bar */
        .progress-container {
            width: 200px;
            margin: 20px auto 0;
            background: rgba(255,255,255,0.2);
            border-radius: 20px;
            height: 3px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #f5b81b;
            border-radius: 20px;
            transition: width 0.15s linear;
        }

        .status-text {
            margin-top: 16px;
            color: #f5b81b;
            font-size: 0.75rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* simple dot animation */
        .dots {
            display: inline-block;
            margin-left: 4px;
        }

        .dots span {
            display: inline-block;
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: #f5b81b;
            margin: 0 1px;
            animation: blink 1.2s infinite;
        }

        .dots span:nth-child(2) { animation-delay: 0.2s; }
        .dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: translateY(0);}
            40% { opacity: 1; transform: translateY(-3px);}
        }
    </style>
</head>
<body>
    <!-- fullscreen video background -->
    <video class="video-bg" autoplay muted loop playsinline preload="auto">
        <source src="/construction/img/bsassets/loaderimage.mp4" type="video/mp4">
    </video>
    <div class="video-overlay"></div>

    <div class="loader-wrapper">
        <!-- custom loader yellow/white theme -->
        <div class="loader"></div>
        <div class="brand">BS ENTERPRISE</div>
        <div class="sub">Your Partner in Construction Success</div>
        
        <div class="progress-container">
            <div class="progress-bar" id="progressFill"></div>
        </div>
        <div class="status-text">
            Loading
            <div class="dots">
                <span></span><span></span><span></span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const targetUrl = '/construction/index.html';
            let progress = 0;
            const progressEl = document.getElementById('progressFill');
            let minTimeReached = false;
            let readyToRedirect = false;
            const MIN_DISPLAY = 1300; // minimum show time

            function updateProgress(value) {
                let percent = Math.min(100, Math.max(0, value));
                if (progressEl) {
                    progressEl.style.width = percent + '%';
                }
                progress = percent;
            }

            // gentle progress simulation
            function startProgressSimulation() {
                updateProgress(0);
                setTimeout(() => { if (progress < 25) updateProgress(25); }, 150);
                setTimeout(() => { if (progress < 50) updateProgress(50); }, 400);
                setTimeout(() => { if (progress < 72) updateProgress(72); }, 700);
                setTimeout(() => { if (progress < 86) updateProgress(86); }, 1000);
                setTimeout(() => { 
                    if (progress < 95 && !minTimeReached) updateProgress(95); 
                }, 1200);
            }

            function redirect() {
                if (progress < 100) {
                    updateProgress(100);
                    setTimeout(() => {
                        window.location.href = targetUrl;
                    }, 120);
                } else {
                    window.location.href = targetUrl;
                }
            }

            function checkRedirect() {
                if (minTimeReached && readyToRedirect) {
                    redirect();
                }
            }

            // minimum time delay
            setTimeout(() => {
                minTimeReached = true;
                checkRedirect();
            }, MIN_DISPLAY);

            // ready after DOM + tiny buffer
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    setTimeout(() => {
                        readyToRedirect = true;
                        checkRedirect();
                    }, 60);
                });
            } else {
                setTimeout(() => {
                    readyToRedirect = true;
                    checkRedirect();
                }, 60);
            }

            // fallback redirect at max 3.5 seconds
            setTimeout(() => {
                if (window.location.pathname !== targetUrl) {
                    window.location.href = targetUrl;
                }
            }, 3500);

            startProgressSimulation();
        })();
    </script>
</body>
</html>
